<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MOVEFIT · Gestão de Academia</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f766e'/%3E%3Cg transform='scale(.667)' fill='none' stroke='%23fff' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='30' cy='9' r='4.2' fill='%23fff' stroke='none'/%3E%3Cpath d='M28 15L22 28M27.5 18L33.5 23L39 20M26.5 18.5L20 17L15 21M22 28L29 34L28 42M22 28L16 34L9 33'/%3E%3C/g%3E%3C/svg%3E">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MOVEFIT">
<style>
:root{--bg:#f1f3f6;--sf:#fff;--tx:#14181f;--mu:#6b7280;--bd:#e3e6eb;--pr:#0f766e;--prt:#fff;--ok:#16a34a;--wa:#b45309;--ba:#dc2626;--okb:#dcfce7;--wab:#fef3c7;--bab:#fee2e2;--nv:#0b1220;--tint:#e6f6f4;--tc:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0f14;--sf:#171b22;--tx:#eef0f3;--mu:#98a1b0;--bd:#262c36;--pr:#2dd4bf;--prt:#042f2a;--ok:#4ade80;--wa:#fbbf24;--ba:#f87171;--okb:#12301d;--wab:#3a2c0b;--bab:#3b1515;--tint:#0f2a28;--tc:#0b1220;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c0f14;--sf:#171b22;--tx:#eef0f3;--mu:#98a1b0;--bd:#262c36;--pr:#2dd4bf;--prt:#042f2a;--ok:#4ade80;--wa:#fbbf24;--ba:#f87171;--okb:#12301d;--wab:#3a2c0b;--bab:#3b1515;--tint:#0f2a28;--tc:#0b1220;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.app{display:flex;height:100%}
nav{width:236px;background:var(--nv);color:#94a3b8;padding:18px 12px;display:flex;flex-direction:column;gap:6px;flex-shrink:0;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;color:#fff;font-weight:800;font-size:16px;letter-spacing:.02em}
.brand i{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#14b8a6,#0f766e);display:grid;place-items:center}
nav .lb{font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;color:#475569}
nav button{all:unset;cursor:pointer;padding:11px 12px;border-radius:10px;font-weight:500;display:flex;gap:12px;align-items:center;transition:background .15s,color .15s}
nav button:hover{background:rgba(255,255,255,.07);color:#fff}
nav button.on{background:#14b8a6;color:#04201c;font-weight:700}
nav button.lgo{justify-content:center;margin-top:4px;color:#fca5a5;border:1px solid rgba(248,113,113,.3);font-weight:600}
.sp{flex:1}
.usr{display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;background:rgba(255,255,255,.06);color:#fff}
.usr b{width:34px;height:34px;border-radius:50%;background:#14b8a6;display:grid;place-items:center;color:#04201c}
.usr small{display:block;color:#64748b}
main{flex:1;overflow:auto;padding:18px;min-width:0}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:20px;margin:0;flex:1;min-width:120px}
h3{margin:0 0 10px;font-size:14px}
select,input{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-width:0}
input:focus-visible,select:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.btn{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:8px;padding:8px 14px;font-weight:600}
.btn.p{background:var(--pr);color:var(--prt);border-color:var(--pr)}
.btn.g{width:100%;padding:14px;font-size:15px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi small{color:var(--mu);display:block}.kpi b{font-size:22px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:99px;padding:5px 12px}
.chip.on{background:var(--pr);color:var(--prt);border-color:var(--pr)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--ok);color:var(--tc)}
.tag.w{background:var(--wa)}.tag.r{background:var(--ba)}.tag.m{background:var(--bd);color:var(--mu)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd)}
th{color:var(--mu);font-weight:600;font-size:12px}
tr.cl{cursor:pointer}tr.cl:hover{background:var(--tint)}
.wrap{overflow-x:auto}
.hint{color:var(--mu);font-size:12px;margin:0 0 12px}
.frm{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.frm input,.frm select{flex:1;min-width:120px}
.dots{display:inline-flex;gap:4px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--bd)}.dots i.on{background:var(--pr)}
.bar{height:8px;border-radius:5px;background:var(--bd);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--pr)}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mu)}
.bars i{width:100%;max-width:38px;background:var(--pr);border-radius:6px 6px 0 0;min-height:3px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.heat i{aspect-ratio:1;border-radius:6px;background:var(--bd)}.heat i.on{background:var(--pr)}
.ex{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--bd);border-radius:12px;background:var(--sf);margin-bottom:8px}
.ex.ok{border-color:var(--ok);background:var(--okb)}
.xi{width:92px;height:66px;border-radius:10px;background:var(--tint);color:var(--pr);overflow:hidden;flex-shrink:0}
.xi svg{width:100%;height:100%}.xi img{width:100%;height:100%;object-fit:cover}
.ex .in{flex:1;min-width:0}.ex b{display:block}.ex small{color:var(--mu)}
.ck{width:42px;height:42px;border-radius:50%;border:2px solid var(--bd);background:var(--sf);color:var(--prt);cursor:pointer;display:grid;place-items:center}
.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.hero{background:linear-gradient(135deg,#14b8a6,#0f766e);color:#fff;border:0;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hero h1{color:#fff}.hero .btn{background:#fff;color:#0f766e;border-color:#fff}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.56);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.mod .card{width:100%;max-width:440px;max-height:100%;overflow:auto}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:9;display:none}
.lg{min-height:100%;display:grid;place-items:center;padding:20px;background:radial-gradient(60% 48% at 50% 38%,rgba(20,184,166,.22),transparent 72%),#0b1220;color:#fff}
.lg .box{width:100%;max-width:380px;text-align:center}
.tile{width:88px;height:88px;border-radius:26px;background:linear-gradient(135deg,#14b8a6,#0f766e);display:grid;place-items:center;margin:0 auto;box-shadow:0 18px 50px rgba(20,184,166,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.lg h2{font-size:28px;font-weight:800;letter-spacing:.03em;margin:20px 0 4px}
.lg p{color:#94a3b8;margin:0 0 22px}
.lg .btn{width:100%;margin-top:10px;padding:14px;font-size:15px;background:#14b8a6;color:#04201c;border:0}
.lg .btn.o{background:rgba(255,255,255,.08);color:#fff}
.lg select{width:100%;background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.18)}
.lg option{color:#14181f}
@media (max-width:760px){
.app{flex-direction:column-reverse}
nav{width:auto;flex-direction:row;padding:6px;justify-content:space-around;gap:0}
nav .brand,nav .sp,nav .usr,nav .lb{display:none}
nav button{flex-direction:column;gap:2px;font-size:10px;padding:6px 4px}
main{padding:12px}.two{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fx" accept="image/*" hidden>
<script>
/* ===== Camada de dados =====
   Hoje: memória + localStorage (try/catch). Para o Supabase, trocar apenas DB.load/DB.save
   por chamadas às tabelas: alunos, presencas, treinos, exercicios, medidas. */
const SB={url:'',key:''};
const DB={load(){try{return JSON.parse(localStorage.getItem('movefit.v2'))}catch(e){return null}},save(s){try{localStorage.setItem('movefit.v2',JSON.stringify(s))}catch(e){}}};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DAYS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'],DS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const D=o=>{const d=new Date();d.setDate(d.getDate()+o);return d};
const K=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fd=k=>k.slice(8)+'/'+k.slice(5,7);

/* ===== Ícones ===== */
const RUN='<circle cx="30" cy="9" r="4.2" fill="currentColor" stroke="none"/><path d="M28 15L22 28M27.5 18L33.5 23L39 20M26.5 18.5L20 17L15 21M22 28L29 34L28 42M22 28L16 34L9 33"/><path d="M4 14h7M2 21h6" opacity=".55"/>';
const LG=(s,w=3.4)=>`<svg viewBox="0 0 48 48" style="width:${s}px;height:${s}px;stroke-width:${w}">${RUN}</svg>`;
const I={home:'<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>',
users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 3-6 6.5-6s6.5 2.4 6.5 6M17 4.5a3.5 3.5 0 010 7M21.5 20c0-2.6-1.6-4.6-4-5.5"/>',
check:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3L16.5 9"/>',
dumb:'<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>',
chart:'<path d="M4 20V11M10 20V4M16 20v-8M22 20H2"/>',
out:'<path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/>',
ok:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>'};
const ic=(n,s=20)=>`<svg viewBox="0 0 24 24" style="width:${s}px;height:${s}px">${I[n]}</svg>`;

/* ===== Exercícios: figuras (sem fotos, até o profissional enviar a dele) ===== */
const POSE={agach:'<circle cx="48" cy="14" r="5"/><path d="M48 20L45 38L60 43L55 60M47 24L62 26M28 62h52"/>',
supino:'<circle cx="22" cy="34" r="5"/><path d="M28 38H62L72 48V62M40 38V16M26 16H54M20 42H66"/>',
remada:'<circle cx="30" cy="22" r="5"/><path d="M35 26L58 36L62 62M58 36L52 62M42 30V48M37 48h10"/>',
rosca:'<circle cx="50" cy="12" r="5"/><path d="M50 18V42L44 62M50 42L56 62M50 22L54 34L63 27M60 24l6 6"/>',
desenv:'<circle cx="50" cy="16" r="5"/><path d="M50 22V44L44 62M50 44L56 62M50 26L40 24L38 10M50 26L60 24L62 10M33 10h10M57 10h10"/>',
prancha:'<circle cx="20" cy="38" r="5"/><path d="M26 42L82 52M32 44V58M10 58H92"/>',
esteira:`<g transform="translate(28 4) scale(1.3)">${RUN}</g>`,
halt:'<path d="M22 35h56M30 24v22M70 24v22M20 29v12M80 29v12"/>'};
const LIB={'Agachamento livre':'agach','Supino reto':'supino','Remada curvada':'remada','Rosca direta':'rosca','Desenvolvimento':'desenv','Prancha':'prancha','Esteira':'esteira'};
const pose=n=>{const k=Object.keys(LIB).find(x=>x.toLowerCase()==String(n).trim().toLowerCase());return POSE[LIB[k]]||POSE.halt};
const exImg=e=>`<div class="xi">${e.foto?`<img src="${e.foto}" alt="${esc(e.n)}">`:`<svg viewBox="0 0 100 70" style="stroke-width:3">${pose(e.n)}</svg>`}</div>`;

/* ===== Dados iniciais ===== */
function seed(){let x=0;const e=(n,s,r,c)=>({id:++x,n,s,r,c});
 const P={0:[],1:[e('Supino reto',4,'10','40 kg'),e('Desenvolvimento',3,'12','16 kg'),e('Prancha',3,'40 s','—')],2:[e('Remada curvada',4,'10','30 kg'),e('Rosca direta',3,'12','14 kg'),e('Prancha',3,'40 s','—')],3:[e('Agachamento livre',4,'12','50 kg'),e('Esteira',1,'20 min','—')],4:[e('Supino reto',4,'8','45 kg'),e('Desenvolvimento',4,'10','18 kg')],5:[e('Remada curvada',4,'10','32 kg'),e('Rosca direta',4,'10','16 kg')],6:[e('Agachamento livre',3,'15','40 kg'),e('Prancha',3,'45 s','—'),e('Esteira',1,'15 min','—')]};
 const A=[['Mariana Souza','Mensal',12,'Emagrecimento',68.4],['Carlos Eduardo','Trimestral',45,'Hipertrofia',82.1],['Beatriz Lima','Mensal',3,'Condicionamento',59],['João Pedro','Anual',200,'Hipertrofia',90.3],['Fernanda Alves','Mensal',6,'Emagrecimento',74.2],['Rafael Costa','Semestral',80,'Resistência',77.5]];
 const alunos=A.map((a,i)=>({id:i+1,nome:a[0],tel:'(81) 9'+(8000+i*137)+'-'+(1000+i*311),plano:a[1],venc:K(D(a[2])),obj:a[3],ativo:true,prof:i%2+1}));
 const pesos={};A.forEach((a,i)=>{const d=a[3]=='Hipertrofia'?-1:1;pesos[i+1]=[3,2,1,0].map(k=>+(a[4]+d*k*.5).toFixed(1))});
 const pres={};for(let o=-27;o<=0;o++){const d=D(o);pres[K(d)]=d.getDay()==0?[]:alunos.map(a=>a.id).filter(i=>o==0?i<=2:i==3&&o>-6?false:(i*5+Math.abs(o)*2)%7<4)}
 const plano={};alunos.forEach(a=>{plano[a.id]={};for(const d in P)plano[a.id][d]=P[d].map(e=>({...e,id:++x}))});return{academia:{nome:'Academia MOVEFIT Centro',tel:'(81) 3333-4455'},profs:[{id:1,nome:'Prof. Ricardo',tel:'(81) 98811-2233'},{id:2,nome:'Profª Camila',tel:'(81) 98822-3344'}],alunos,plano,pres,done:{},pesos,xid:x,aid:6,prid:2}}
let S=DB.load()||seed();
let V={role:null,tab:'',dia:new Date().getDay(),uid:1,pid:1,aluno:0,modal:null};
const save=()=>DB.save(S);
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}

/* ===== Regras ===== */
const meus=()=>V.role=='pro'?S.alunos.filter(a=>a.prof==V.pid):S.alunos;
const ativos=()=>meus().filter(a=>a.ativo);
const pres=(id,o=0)=>(S.pres[K(D(o))]||[]).includes(id);
const sem=id=>{let n=0;for(let o=-6;o<=0;o++)if(pres(id,o))n++;return n};
const mes=id=>{let n=0;for(let o=-27;o<=0;o++)if(pres(id,o))n++;return n};
const ult=id=>{for(let o=0;o>-30;o--)if(pres(id,o))return -o;return 30};
const dv=a=>Math.round((new Date(a.venc+'T00:00')-new Date(K(new Date())+'T00:00'))/864e5);
const seq=id=>{let n=0;for(let o=0;o>-28;o--){if(D(o).getDay()==0)continue;if(pres(id,o))n++;else if(o<0)break}return n};
function togglePres(id){const k=K(new Date()),l=S.pres[k]=S.pres[k]||[];const i=l.indexOf(id);i>=0?l.splice(i,1):l.push(id);save();render();toast(i>=0?'Presença removida':'Check-in registrado')}
const ult2=id=>{const u=ult(id);return u==0?'Hoje':u>=30?'30+ dias':'há '+u+' d'};
const dots=id=>`<span class="dots">${[-6,-5,-4,-3,-2,-1,0].map(o=>`<i class="${pres(id,o)?'on':''}"></i>`).join('')}</span>`;
const heat=id=>`<div class="heat">${Array.from({length:28},(_,i)=>`<i class="${pres(id,i-27)?'on':''}" title="${fd(K(D(i-27)))}"></i>`).join('')}</div>`;
const kpi=(l,v,s='')=>`<div class="card kpi"><small>${l}</small><b>${v}</b>${s?`<small>${s}</small>`:''}</div>`;
const bars=(v,l)=>{const m=Math.max(...v,1);return`<div class="bars">${v.map((n,i)=>`<div><span>${n}</span><i style="height:${n/m*85}%"></i><span>${l[i]}</span></div>`).join('')}</div>`};
function readImg(f,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,480/im.width);c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72))};im.src=r.result};r.readAsDataURL(f)}
const exCard=(e,extra='')=>`<div class="ex ${extra.ok?'ok':''}">${exImg(e)}<div class="in"><b>${esc(e.n)}</b><small>${e.s} × ${esc(e.r)} · ${esc(e.c)}</small></div>${extra.btn||''}</div>`;

/* ===== Telas do PROFISSIONAL ===== */
const NP=[['painel','Painel','home'],['alunos','Alunos','users'],['pres','Presença','check'],['treinos','Treinos','dumb'],['rel','Relatórios','chart']];
const PV={
painel(){const at=ativos(),hj=at.filter(a=>pres(a.id)),f7=Math.round(at.reduce((t,a)=>t+Math.min(sem(a.id),5),0)/(at.length*5||1)*100);
 const venc=at.filter(a=>dv(a)<=7),aus=at.filter(a=>ult(a.id)>=4);
 const at1=[...aus.map(a=>`<div class="row"><span>${esc(a.nome)}</span><span class="tag r">sem treinar ${ult2(a.id)}</span></div>`),...venc.map(a=>`<div class="row"><span>${esc(a.nome)}</span><span class="tag w">plano vence em ${Math.max(dv(a),0)} d</span></div>`)].join('')||'<p class="hint">Tudo em dia.</p>';
 return`<div class="top"><h1>Acompanhamento</h1><span class="hint" style="margin:0">${DAYS[new Date().getDay()]}, ${fd(K(new Date()))}</span></div>
 <div class="kpis">${kpi('Alunos ativos',at.length)}${kpi('Presentes hoje',hj.length)}${kpi('Frequência 7 dias',f7+'%','meta: 5 treinos/semana')}${kpi('Planos a vencer',venc.length,'em até 7 dias')}</div>
 <div class="two"><div class="card"><h3>Atenção</h3>${at1}</div><div class="card"><h3>Presentes hoje</h3>${hj.map(a=>`<div class="row"><span>${esc(a.nome)}</span><span class="tag">${esc(a.obj)}</span></div>`).join('')||'<p class="hint">Ninguém fez check-in ainda.</p>'}</div></div>
 <div class="card" style="margin-top:12px"><h3>Alunos · toque para ver o acompanhamento</h3><div class="wrap"><table><tr><th>Aluno</th><th>Objetivo</th><th>Últimos 7 dias</th><th>Última visita</th></tr>
 ${at.map(a=>`<tr class="cl" onclick="V.modal=${a.id};render()"><td><b>${esc(a.nome)}</b></td><td>${esc(a.obj)}</td><td>${dots(a.id)}</td><td>${ult2(a.id)}</td></tr>`).join('')}</table></div></div>`},
alunos(){return`<div class="top"><h1>Cadastro de alunos</h1></div>
 <div class="card"><h3>Novo aluno</h3><div class="frm"><input id="nn" placeholder="Nome completo"><input id="nt" placeholder="WhatsApp com DDD">${V.role=='acad'?`<select id="nf">${S.profs.map(p=>`<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select>`:''}<select id="np"><option>Mensal</option><option>Trimestral</option><option>Semestral</option><option>Anual</option></select><select id="no"><option>Emagrecimento</option><option>Hipertrofia</option><option>Condicionamento</option><option>Resistência</option></select><input id="nw" type="number" step=".1" placeholder="Peso (kg)"><button class="btn p" onclick="addAluno()">Cadastrar</button></div></div>
 <div class="card" style="margin-top:12px"><div class="wrap"><table><tr><th>Nome</th><th>WhatsApp</th><th>Plano</th><th>Vencimento</th><th>Status</th><th></th></tr>
 ${meus().map(a=>`<tr><td><b>${esc(a.nome)}</b><br><small class="hint">${esc(a.obj)} · ${esc(profNome(a.prof))}</small></td><td><a href="${waUrl(a.tel)}" target="_blank" rel="noopener" style="color:var(--pr)">${esc(a.tel)}</a></td><td>${esc(a.plano)}</td><td>${fd(a.venc)}</td><td><span class="tag ${a.ativo?'':'m'}">${a.ativo?'Ativo':'Inativo'}</span></td><td style="white-space:nowrap">${V.role=='acad'?`<select onchange="setProf(${a.id},this.value)">${S.profs.map(p=>`<option value="${p.id}" ${p.id==a.prof?'selected':''}>${esc(p.nome)}</option>`).join('')}</select> `:`<button class="btn" onclick="V.aluno=${a.id};V.tab='treinos';render()">Montar treino</button> <a class="btn p" href="${waUrl(a.tel,treinoTxt(a,new Date().getDay()))}" target="_blank" rel="noopener">Enviar treino</a> `}<button class="btn" onclick="togAluno(${a.id})">${a.ativo?'Inativar':'Ativar'}</button></td></tr>`).join('')}</table></div></div>`},
pres(){return`<div class="top"><h1>Presença de hoje</h1><span class="tag">${ativos().filter(a=>pres(a.id)).length} presentes</span></div>
 <div class="card"><div class="wrap"><table><tr><th>Aluno</th><th>7 dias</th><th>Hoje</th></tr>
 ${ativos().map(a=>`<tr><td><b>${esc(a.nome)}</b></td><td>${dots(a.id)}</td><td><button class="btn ${pres(a.id)?'':'p'}" onclick="togglePres(${a.id})">${pres(a.id)?'Presente · desfazer':'Fazer check-in'}</button></td></tr>`).join('')}</table></div></div>`},
treinos(){const al=ativos();if(!al.length)return'<div class="top"><h1>Montar treino</h1></div><div class="card"><p class="hint">Cadastre um aluno primeiro.</p></div>';if(!al.some(a=>a.id==V.aluno))V.aluno=al[0].id;const A=S.alunos.find(a=>a.id==V.aluno),d=V.dia,l=pl(A.id,d);
 return`<div class="top"><h1>Montar treino</h1><select onchange="V.aluno=+this.value;render()">${al.map(a=>`<option value="${a.id}" ${a.id==A.id?'selected':''}>${esc(a.nome)}</option>`).join('')}</select><a class="btn p" href="${waUrl(A.tel,treinoTxt(A,d))}" target="_blank" rel="noopener">Enviar treino de ${DS[d]} no WhatsApp</a></div>
 <div class="chips">${[1,2,3,4,5,6,0].map(i=>`<button class="chip ${i==d?'on':''}" onclick="V.dia=${i};render()">${DS[i]}</button>`).join('')}</div>
 <div class="card"><h3>${DAYS[d]} · ${l.length} exercício${l.length==1?'':'s'}</h3>${l.map(e=>exCard(e,{btn:`<button class="btn" onclick="fotoEx(${e.id})" title="Trocar foto">${ic('cam',18)}</button><button class="btn" onclick="delEx(${e.id})">Remover</button>`})).join('')||'<p class="hint">Dia de descanso. Adicione exercícios abaixo.</p>'}
 <h3 style="margin-top:14px">Adicionar exercício</h3><div class="frm"><input id="en" list="lib" placeholder="Nome do exercício"><datalist id="lib">${Object.keys(LIB).map(k=>`<option value="${k}">`).join('')}</datalist><input id="es" type="number" min="1" placeholder="Séries"><input id="er" placeholder="Reps / tempo"><input id="ec" placeholder="Carga"></div>
 <div class="frm"><input id="ef" type="file" accept="image/*"><button class="btn p" onclick="addEx()">Adicionar ao treino</button></div>
 <p class="hint" style="margin-top:10px">Sem foto enviada, o exercício usa a figura padrão. As fotos reduzem automaticamente para caber no navegador.</p></div>`},
rel(){const at=ativos(),w=[0,0,0,0,0,0];let tot=0;for(let o=-27;o<=0;o++){const d=D(o).getDay();if(d==0)continue;const n=(S.pres[K(D(o))]||[]).length;w[d-1]+=n;tot+=n}
 const ret=at.filter(a=>ult(a.id)<=14).length,rk=[...at].sort((a,b)=>mes(b.id)-mes(a.id));
 return`<div class="top"><h1>Relatórios</h1><span class="hint" style="margin:0">últimos 28 dias</span></div>
 <div class="kpis">${kpi('Check-ins',tot)}${kpi('Média por dia',(tot/24).toFixed(1),'dias de funcionamento')}${kpi('Retenção',Math.round(ret/(at.length||1)*100)+'%','treinou em 14 dias')}${kpi('Inativos / vencidos',meus().length-at.length+at.filter(a=>dv(a)<0).length)}</div>
 <div class="two"><div class="card"><h3>Movimento por dia da semana</h3>${bars(w,DS.slice(1).concat([]).slice(0,6))}</div>
 <div class="card"><h3>Ranking de frequência</h3>${rk.map(a=>`<div style="margin-bottom:8px"><div class="row" style="border:0;padding:0"><span>${esc(a.nome)}</span><b>${mes(a.id)} treinos</b></div><div class="bar"><i style="width:${Math.min(mes(a.id)/24*100,100)}%"></i></div></div>`).join('')}</div></div>
 <div class="card" style="margin-top:12px"><h3>Planos por vencimento</h3>${[...at].sort((a,b)=>dv(a)-dv(b)).slice(0,5).map(a=>`<div class="row"><span>${esc(a.nome)} · ${esc(a.plano)}</span><span class="tag ${dv(a)<=7?'w':'m'}">${fd(a.venc)} · ${dv(a)} d</span></div>`).join('')}</div>`}
};
function modalAluno(){const a=S.alunos.find(x=>x.id==V.modal),p=S.pesos[a.id]||[],d=S.done;
 return`<div class="mod" onclick="V.modal=null;render()"><div class="card" onclick="event.stopPropagation()"><h3 style="font-size:17px">${esc(a.nome)}</h3><p class="hint">${esc(a.obj)} · plano ${esc(a.plano)} até ${fd(a.venc)} · ${esc(a.tel)}</p>
 <div class="kpis"><div class="card kpi"><small>Treinos em 28 dias</small><b>${mes(a.id)}</b></div><div class="card kpi"><small>Sequência</small><b>${seq(a.id)} d</b></div></div>
 <h3>Frequência</h3>${heat(a.id)}<h3 style="margin-top:14px">Peso (kg)</h3>${p.length?bars(p,p.map((_,i)=>'#'+(i+1))):'<p class="hint">Sem registros.</p>'}
 <button class="btn g" style="margin-top:12px" onclick="V.modal=null;render()">Fechar</button></div></div>`}

/* ===== Academia (administração) e WhatsApp ===== */
const pl=(id,d)=>{const p=S.plano[id]=S.plano[id]||{};return p[d]=p[d]||[]};
const profOf=a=>S.profs.find(p=>p.id==a.prof)||S.profs[0]||{nome:'',tel:''};
const profNome=id=>(S.profs.find(p=>p.id==id)||{}).nome||'—';
const waUrl=(tel,txt)=>{let n=String(tel||'').replace(/\D/g,'');if(n.length&&n.length<=11)n='55'+n;return'https://wa.me/'+n+(txt?'?text='+encodeURIComponent(txt):'')};
const treinoTxt=(a,d)=>{const l=pl(a.id,d);return`Olá, ${a.nome.split(' ')[0]}! Seu treino de ${DAYS[d]}${d==new Date().getDay()?' (hoje)':''}:\n\n`+(l.length?l.map((e,i)=>`${i+1}. ${e.n} — ${e.s}x${e.r}${e.c&&e.c!='—'?' · '+e.c:''}`).join('\n'):'Dia de descanso.')+`\n\nBom treino! 💪 — ${profOf(a).nome} · MOVEFIT`};
const NA=[['painel','Visão geral','home'],['profs','Profissionais','users'],['alunos','Alunos','users'],['rel','Relatórios','chart']];
const PA={painel:PV.painel,alunos:PV.alunos,rel:PV.rel,
profs(){return`<div class="top"><h1>Profissionais</h1></div><div class="card"><h3>Novo profissional</h3><div class="frm"><input id="pn" placeholder="Nome"><input id="pt" placeholder="WhatsApp com DDD"><button class="btn p" onclick="addProf()">Cadastrar</button></div></div><div class="card" style="margin-top:12px"><div class="wrap"><table><tr><th>Nome</th><th>WhatsApp</th><th>Alunos ativos</th></tr>${S.profs.map(p=>`<tr><td><b>${esc(p.nome)}</b></td><td><a href="${waUrl(p.tel)}" target="_blank" rel="noopener" style="color:var(--pr)">${esc(p.tel)}</a></td><td>${S.alunos.filter(a=>a.prof==p.id&&a.ativo).length}</td></tr>`).join('')}</table></div></div>`}};
function addProf(){const n=$('#pn').value.trim();if(!n)return toast('Informe o nome');S.profs.push({id:++S.prid,nome:n,tel:$('#pt').value||'—'});save();render();toast('Profissional cadastrado')}
function setProf(id,p){S.alunos.find(a=>a.id==id).prof=+p;save();render();toast('Aluno transferido')}

/* ===== Telas do ALUNO ===== */
const NS=[['hoje','Treino de hoje','dumb'],['evo','Minha evolução','chart']];
const SV={
hoje(){const a=S.alunos.find(x=>x.id==V.uid),l=pl(V.uid,new Date().getDay()),k=K(new Date()),dn=S.done[k+'|'+a.id]||[],p=pres(a.id),pc=l.length?Math.round(dn.length/l.length*100):0;
 return`<div class="card hero"><div style="flex:1;min-width:180px"><h1>Olá, ${esc(a.nome.split(' ')[0])}!</h1><div>${DAYS[new Date().getDay()]} · plano ${esc(a.plano)} até ${fd(a.venc)} · ${esc(profOf(a).nome)}</div></div><a class="btn" href="${waUrl(profOf(a).tel,'Olá, '+esc(profOf(a).nome)+'! Aqui é '+a.nome+'.')}" target="_blank" rel="noopener">WhatsApp do professor</a><button class="btn" onclick="togglePres(${a.id})">${p?'Presença confirmada ✓':'Fazer check-in'}</button></div>
 <div class="card" style="margin-top:12px"><div class="row" style="border:0"><h3 style="margin:0">Treino do dia</h3><b>${dn.length}/${l.length}</b></div><div class="bar" style="margin-bottom:12px"><i style="width:${pc}%"></i></div>
 ${l.map(e=>exCard(e,{ok:dn.includes(e.id),btn:`<button class="ck ${dn.includes(e.id)?'on':''}" onclick="togDone(${e.id})" aria-label="Concluir">${ic('ok',22)}</button>`})).join('')||'<div class="hint" style="text-align:center;padding:20px">Hoje é dia de descanso. Aproveite para se recuperar.</div>'}
 ${l.length&&pc==100?'<p style="text-align:center;font-weight:700;color:var(--ok)">Treino concluído! Bom trabalho.</p>':''}</div>`},
evo(){const a=S.alunos.find(x=>x.id==V.uid),p=S.pesos[a.id]=S.pesos[a.id]||[],v=p.length>1?(p[p.length-1]-p[0]).toFixed(1):'0.0',wk=[-21,-14,-7,0].map(o=>{let n=0;for(let i=o-6;i<=o;i++)if(pres(a.id,i))n++;return n});
 return`<div class="top"><h1>Minha evolução</h1></div>
 <div class="kpis">${kpi('Treinos em 28 dias',mes(a.id))}${kpi('Sequência',seq(a.id)+' d')}${kpi('Peso atual',(p[p.length-1]||'—')+' kg',(v>0?'+':'')+v+' kg desde o início')}</div>
 <div class="two"><div class="card"><h3>Peso</h3>${p.length?bars(p,p.map((_,i)=>'#'+(i+1))):''}<div class="frm"><input id="pw" type="number" step=".1" placeholder="Novo peso (kg)"><button class="btn p" onclick="addPeso()">Registrar</button></div></div>
 <div class="card"><h3>Treinos por semana</h3>${bars(wk,['3 sem','2 sem','1 sem','Esta'])}</div></div>
 <div class="card" style="margin-top:12px"><h3>Calendário de presença · 28 dias</h3>${heat(a.id)}</div>`}
};

/* ===== Ações ===== */
function addAluno(){const n=$('#nn').value.trim();if(!n)return toast('Informe o nome');S.alunos.push({id:++S.aid,nome:n,tel:$('#nt').value||'—',plano:$('#np').value,venc:K(D(30)),obj:$('#no').value,ativo:true,prof:V.role=='acad'?+$('#nf').value:V.pid});const w=parseFloat($('#nw').value);S.pesos[S.aid]=w?[w]:[];S.pres[K(new Date())]=S.pres[K(new Date())]||[];save();render();toast('Aluno cadastrado')}
function togAluno(id){const a=S.alunos.find(x=>x.id==id);a.ativo=!a.ativo;save();render()}
function addEx(){const n=$('#en').value.trim();if(!n)return toast('Informe o exercício');const f=$('#ef').files[0],go=foto=>{pl(V.aluno,V.dia).push({id:++S.xid,n,s:+$('#es').value||3,r:$('#er').value||'10',c:$('#ec').value||'—',foto});save();render();toast('Exercício adicionado')};f?readImg(f,go):go('')}
function delEx(id){const p=S.plano[V.aluno];p[V.dia]=p[V.dia].filter(e=>e.id!=id);save();render()}
function fotoEx(id){V.fx=id;$('#fx').click()}
$('#fx').onchange=ev=>{const f=ev.target.files[0];if(!f)return;readImg(f,d=>{Object.values(S.plano[V.aluno]).flat().filter(e=>e.id==V.fx).forEach(e=>e.foto=d);save();render();toast('Foto atualizada')});ev.target.value=''};
function togDone(id){const k=K(new Date())+'|'+V.uid,l=S.done[k]=S.done[k]||[],i=l.indexOf(id);i>=0?l.splice(i,1):l.push(id);if(l.length&&!pres(V.uid)){const t=K(new Date());(S.pres[t]=S.pres[t]||[]).push(V.uid)}save();render()}
function addPeso(){const w=parseFloat($('#pw').value);if(!w)return toast('Informe o peso');S.pesos[V.uid].push(w);save();render()}
function entrar(r){V.role=r;V.tab=r=='aluno'?'hoje':'painel';V.dia=new Date().getDay();if(r=='aluno')V.uid=+$('#su').value;if(r=='pro')V.pid=+$('#sp').value;render()}
const sair=()=>{V.role=null;V.modal=null;render()};
const go=t=>{V.tab=t;render()};

/* ===== Estrutura ===== */
function login(){return`<div class="lg"><div class="box"><div class="tile" style="color:#fff">${LG(54)}</div><h2>MOVEFIT</h2><p>Treino, presença e evolução em um só lugar</p>
 <button class="btn" onclick="entrar('acad')">Entrar como academia</button>
 <div style="margin:18px 0 6px;color:#64748b;font-size:12px">ou entre como profissional</div><select id="sp">${S.profs.map(p=>`<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select>
 <button class="btn o" onclick="entrar('pro')">Entrar como profissional</button>
 <div style="margin:18px 0 6px;color:#64748b;font-size:12px">ou entre como aluno</div><select id="su">${S.alunos.filter(a=>a.ativo).map(a=>`<option value="${a.id}">${esc(a.nome)}</option>`).join('')}</select>
 <button class="btn o" onclick="entrar('aluno')">Entrar como aluno</button>
 <p style="margin-top:22px;font-size:12px">Modo demonstração · login real com Supabase em breve</p></div></div>`}
function shell(items,body){const pro=V.role!='aluno',a=S.alunos.find(x=>x.id==V.uid),rl={acad:['Academia',S.academia.nome],pro:['Profissional',profNome(V.pid)],aluno:['Aluno']}[V.role];
 return`<div class="app"><nav><div class="brand"><i style="color:#fff">${LG(20,3.6)}</i>MOVEFIT</div><div class="lb">${rl[0]}</div>
 ${items.map(i=>`<button class="${V.tab==i[0]?'on':''}" onclick="go('${i[0]}')">${ic(i[2])}<span>${i[1]}</span></button>`).join('')}
 <div class="sp"></div><div class="usr"><b>${esc((pro?rl[1]:a.nome)[0])}</b><div>${esc(pro?rl[1]:a.nome.split(' ')[0])}<small>${pro?rl[0]:esc(a.obj)}</small></div></div>
 <button class="lgo" onclick="sair()">${ic('out',18)}<span>Sair</span></button></nav><main>${body}</main></div>`}
function render(){const el=$('#app');if(!V.role){el.innerHTML=login();return}
 const R={acad:[NA,PA],pro:[NP,PV],aluno:[NS,SV]}[V.role];el.innerHTML=shell(R[0],R[1][V.tab]());
 if(V.role!='aluno'&&V.modal)el.insertAdjacentHTML('beforeend',modalAluno())}
render();
</script>
</body>
</html>
