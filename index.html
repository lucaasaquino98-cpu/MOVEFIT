<style>
:root{--bg:#f1f3f6;--sf:#fff;--tx:#14181f;--mu:#6b7280;--bd:#e3e6eb;--pr:#0f766e;--prt:#fff;--ok:#16a34a;--wa:#b45309;--ba:#dc2626;--okb:#dcfce7;--wab:#fef3c7;--bab:#fee2e2;--nv:#0b1220;--tint:#e6f6f4;--tc:#fff;color-scheme:light}

*{box-sizing:border-box}
html,body{min-height:100%;height:100%;margin:0}

svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.app{display:flex;height:100%;height:100dvh}
nav{width:236px;background:var(--nv);color:#94a3b8;padding:18px 12px;display:flex;flex-direction:column;gap:6px;flex-shrink:0;overflow-y:auto}

.sp{flex:1}

.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.heat i{aspect-ratio:1;border-radius:6px;background:var(--bd)}.heat i.on{background:var(--pr)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:9;display:none}
.lg{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));background:radial-gradient(60% 48% at 50% 38%,rgba(20,184,166,.22),transparent 72%),#0b1220;color:#fff}

.lg h2{font-size:28px;font-weight:800;letter-spacing:.03em;margin:20px 0 4px}
.lg p{color:#94a3b8;margin:0 0 22px}
.lg .btn{width:100%;margin-top:10px;padding:14px;font-size:15px;background:#14b8a6;color:#04201c;border:0}
.lg .btn.o{background:rgba(255,255,255,.08);color:#fff}

.lg option{color:#14181f}
.lg input{width:100%;margin-top:10px;padding:13px;font-size:16px;background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.18)}
.lg input::placeholder{color:#64748b}
.lg .keep{display:flex;align-items:center;gap:10px;margin:14px 0 0;color:#cbd5e1;cursor:pointer;text-align:left;width:100%;background:none;border:0;font:inherit;padding:0}
.lg .keep i{width:22px;height:22px;border-radius:7px;border:2px solid #475569;display:grid;place-items:center;flex-shrink:0}
.lg .keep.on i{background:#14b8a6;border-color:#14b8a6;color:#04201c}
.lg .keep i svg{opacity:0}.lg .keep.on i svg{opacity:1}
.lg .lk{background:none;border:0;color:#5eead4;cursor:pointer;font:inherit;margin-top:14px;padding:6px}
.lg .er{color:#fca5a5;min-height:20px;margin:12px 0 0;font-size:13px}.lg .er.ok{color:#5eead4}
.lg .btn:disabled{opacity:.6;cursor:wait}

/* ===== Animação de entrada: o corredor entra correndo ===== */
.tile,.brand i{overflow:hidden}
.run{overflow:visible}
.run .rb{animation:runX 1s cubic-bezier(.2,.7,.25,1) both}
.run .rl{transform-box:fill-box;transform-origin:100% 50%;animation:runLines 1s ease-out both}
.run{animation:runBob .22s ease-in-out 4}
.tile.pop{animation:tilePop .55s cubic-bezier(.34,1.56,.64,1) both,tileRing .8s ease-out .9s}
.intro h2{animation:fadeUp .6s ease-out .55s both}
.intro p{animation:fadeUp .6s ease-out .8s both}
.fade{animation:fadeIn .45s ease-out both}
@keyframes runX{0%{transform:translateX(-52px);opacity:0}12%{opacity:1}78%{transform:translateX(3px)}100%{transform:translateX(0);opacity:1}}
@keyframes runBob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-2.4px) rotate(-3deg)}}
@keyframes runLines{0%{opacity:0;transform:scaleX(.2)}25%{opacity:.95;transform:scaleX(2.6)}70%{opacity:.85;transform:scaleX(2)}100%{opacity:.55;transform:scaleX(1)}}
@keyframes tilePop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes tileRing{0%{box-shadow:0 18px 50px rgba(20,184,166,.35),inset 0 1px 0 rgba(255,255,255,.25),0 0 0 0 rgba(20,184,166,.5)}100%{box-shadow:0 18px 50px rgba(20,184,166,.35),inset 0 1px 0 rgba(255,255,255,.25),0 0 0 28px rgba(20,184,166,0)}}
@keyframes fadeUp{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}
@keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.run,.run .rb,.run .rl,.tile.pop,.intro h2,.intro p,.fade{animation:none!important}}
@media (max-width:760px){
.app{flex-direction:column-reverse}
nav{width:auto;flex-direction:row;padding:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;gap:0}
nav .brand,nav .sp,nav .usr,nav .lb{display:none}
nav button{flex-direction:column;gap:2px;font-size:10px;padding:6px 4px}
main{padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px))}.two{grid-template-columns:1fr}
}
</style>

<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fx" accept="image/*" hidden>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
/* ===== Camada de dados =====
   Hoje: memória + localStorage (try/catch). Para o Supabase, trocar apenas DB.load/DB.save
   por chamadas às tabelas: alunos, presencas, treinos, exercicios, medidas. */
const SB={url:'https://zievnsdogfbvdttqmmhw.supabase.co',key:'sb_publishable_0w-8wfMVVkcUtV9mT1Uxsw_UW3T40jP'};
const DB={load(){try{return JSON.parse(localStorage.getItem('movefit.v3'))}catch(e){return null}},save(s){try{localStorage.setItem('movefit.v3',JSON.stringify(s))}catch(e){}}};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DAYS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'],DS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const D=o=>{const d=new Date();d.setDate(d.getDate()+o);return d};
const K=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fd=k=>k.slice(8)+'/'+k.slice(5,7);

/* ===== Ícones ===== */
const RUN='<g class="rb"><circle cx="30" cy="9" r="4.2" fill="currentColor" stroke="none"/><path d="M28 15L22 28M27.5 18L33.5 23L39 20M26.5 18.5L20 17L15 21M22 28L29 34L28 42M22 28L16 34L9 33"/></g><path class="rl" d="M4 14h7M2 21h6" opacity=".55"/>';
const LG=(s,w=3.4,c='')=>`<svg class="${c}" viewBox="0 0 48 48" style="width:${s}px;height:${s}px;stroke-width:${w}">${RUN}</svg>`;
/* animações tocam só na 1ª vez de cada tela (render() recria o HTML a cada clique) */
const PLAYED={};const once=k=>PLAYED[k]?false:(PLAYED[k]=true);
const I={home:'<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>',
users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 3-6 6.5-6s6.5 2.4 6.5 6M17 4.5a3.5 3.5 0 010 7M21.5 20c0-2.6-1.6-4.6-4-5.5"/>',
check:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3L16.5 9"/>',
dumb:'<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>',
chart:'<path d="M4 20V11M10 20V4M16 20v-8M22 20H2"/>',
out:'<path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/>',
ok:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>'};
const ic=(n,s=20)=>`<svg viewBox="0 0 24 24" style="width:${s}px;height:${s}px">${I[n]}</svg>`;

/* ===== Exercícios: figuras (sem fotos, até o profissional enviar a dele) ===== */
const POSE={agach:'<circle cx="48" cy="14" r="5"/><path d="M48 20L45 38L60 43L55 60M47 24L62 26M28 62h52"/>',
supino:'<circle cx="22" cy="34" r="5"/><path d="M28 38H62L72 48V62M40 38V16M26 16H54M20 42H66"/>',
remada:'<circle cx="30" cy="22" r="5"/><path d="M35 26L58 36L62 62M58 36L52 62M42 30V48M37 48h10"/>',
rosca:'<circle cx="50" cy="12" r="5"/><path d="M50 18V42L44 62M50 42L56 62M50 22L54 34L63 27M60 24l6 6"/>',
desenv:'<circle cx="50" cy="16" r="5"/><path d="M50 22V44L44 62M50 44L56 62M50 26L40 24L38 10M50 26L60 24L62 10M33 10h10M57 10h10"/>',
prancha:'<circle cx="20" cy="38" r="5"/><path d="M26 42L82 52M32 44V58M10 58H92"/>',
esteira:`<g transform="translate(28 4) scale(1.3)">${RUN}</g>`,
halt:'<path d="M22 35h56M30 24v22M70 24v22M20 29v12M80 29v12"/>'};
const LIB={'Agachamento livre':'agach','Supino reto':'supino','Remada curvada':'remada','Rosca direta':'rosca','Desenvolvimento':'desenv','Prancha':'prancha','Esteira':'esteira'};
const pose=n=>{const k=Object.keys(LIB).find(x=>x.toLowerCase()==String(n).trim().toLowerCase());return POSE[LIB[k]]||POSE.halt};
const exImg=e=>`<div class="xi">${e.foto?`<img src="${e.foto}" alt="${esc(e.n)}">`:`<svg viewBox="0 0 100 70" style="stroke-width:3">${pose(e.n)}</svg>`}</div>`;

/* ===== Estado inicial: vazio. Alunos e profissionais vêm do Supabase após o login ===== */
const empty=()=>({academia:{nome:'MOVEFIT',tel:''},profs:[],alunos:[],plano:{},pres:{},done:{},pesos:{},xid:0,map:{},nid:0});
try{localStorage.removeItem('movefit.v2')}catch(e){}
let S=Object.assign(empty(),DB.load()||{});
let V={role:null,tab:'',dia:new Date().getDay(),uid:0,pid:0,aluno:0,modal:null};
const save=()=>DB.save({map:S.map,nid:S.nid});
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}

/* ===== Regras ===== */
const meus=()=>V.role=='pro'?S.alunos.filter(a=>a.prof==V.pid):S.alunos;
const ativos=()=>meus().filter(a=>a.ativo);
const pres=(id,o=0)=>(S.pres[K(D(o))]||[]).includes(id);
const sem=id=>{let n=0;for(let o=-6;o<=0;o++)if(pres(id,o))n++;return n};
const mes=id=>{let n=0;for(let o=-27;o<=0;o++)if(pres(id,o))n++;return n};
const ult=id=>{for(let o=0;o>-30;o--)if(pres(id,o))return -o;return 30};
const dv=a=>Math.round((new Date(a.venc+'T00:00')-new Date(K(new Date())+'T00:00'))/864e5);
const seq=id=>{let n=0;for(let o=0;o>-28;o--){if(D(o).getDay()==0)continue;if(pres(id,o))n++;else if(o<0)break}return n};
async function togglePres(id){const a=S.alunos.find(x=>x.id==id),k=K(new Date()),l=S.pres[k]=S.pres[k]||[],i=l.indexOf(id),rem=i>=0;
 rem?l.splice(i,1):l.push(id);render();
 const r=rem?await sb.from('mf_presencas').delete().eq('aluno_id',a.sb).eq('dia',k):await sb.from('mf_presencas').upsert({aluno_id:a.sb,dia:k},{onConflict:'aluno_id,dia',ignoreDuplicates:true});
 if(r.error){rem?l.push(id):l.splice(l.indexOf(id),1);render();return toast('Não foi possível salvar: '+r.error.message)}
 toast(rem?'Presença removida':'Check-in registrado')}
const ult2=id=>{const u=ult(id);return u==0?'Hoje':u>=30?'30+ dias':'há '+u+' d'};
const dots=id=>`<span class="dots">${[-6,-5,-4,-3,-2,-1,0].map(o=>`<i class="${pres(id,o)?'on':''}"></i>`).join('')}</span>`;
const heat=id=>`<div class="heat">${Array.from({length:28},(_,i)=>`<i class="${pres(id,i-27)?'on':''}" title="${fd(K(D(i-27)))}"></i>`).join('')}</div>`;
const kpi=(l,v,s='')=>`<div class="card kpi"><small>${l}</small><b>${v}</b>${s?`<small>${s}</small>`:''}</div>`;
const bars=(v,l)=>{const m=Math.max(...v,1);return`<div class="bars">${v.map((n,i)=>`<div><span>${n}</span><i style="height:${n/m*85}%"></i><span>${l[i]}</span></div>`).join('')}</div>`};
function readImg(f,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,480/im.width);c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72))};im.src=r.result};r.readAsDataURL(f)}
const exCard=(e,extra='')=>`<div class="ex ${extra.ok?'ok':''}">${exImg(e)}<div class="in"><b>${esc(e.n)}</b><small>${e.s} × ${esc(e.r)} · ${esc(e.c)}</small></div>${extra.btn||''}</div>`;

/* ===== Telas do PROFISSIONAL ===== */

async function delEx(id){const{error}=await sb.from('mf_exercicios').delete().eq('id',id);if(error)return toast('Não foi possível remover: '+error.message);const p=S.plano[V.aluno];p[V.dia]=p[V.dia].filter(e=>e.id!=id);render()}
function fotoEx(id){V.fx=id;$('#fx').click()}
$('#fx').onchange=ev=>{const f=ev.target.files[0];if(!f)return;readImg(f,async d=>{const{error}=await sb.from('mf_exercicios').update({foto:d}).eq('id',V.fx);if(error)return toast('Não foi possível salvar a foto: '+error.message);Object.values(S.plano[V.aluno]).flat().filter(e=>e.id==V.fx).forEach(e=>e.foto=d);render();toast('Foto atualizada')});ev.target.value=''};
async function togDone(id){const a=S.alunos.find(x=>x.id==V.uid),t=K(new Date()),k=t+'|'+V.uid,l=S.done[k]=S.done[k]||[],i=l.indexOf(id),rem=i>=0,novaPres=!rem&&!pres(V.uid);
 rem?l.splice(i,1):l.push(id);if(novaPres)(S.pres[t]=S.pres[t]||[]).push(V.uid);render();
 let r=rem?await sb.from('mf_feitos').delete().eq('aluno_id',a.sb).eq('dia',t).eq('exercicio_id',id):await sb.from('mf_feitos').insert({aluno_id:a.sb,dia:t,exercicio_id:id});
 if(!r.error&&novaPres)r=await sb.from('mf_presencas').upsert({aluno_id:a.sb,dia:t},{onConflict:'aluno_id,dia',ignoreDuplicates:true});
 if(r.error){rem?l.push(id):l.splice(l.indexOf(id),1);if(novaPres)S.pres[t].splice(S.pres[t].indexOf(V.uid),1);render();toast('Não foi possível salvar: '+r.error.message)}}
async function addPeso(){const w=Math.round(parseFloat($('#pw').value)*10)/10;if(!w)return toast('Informe o peso');const a=S.alunos.find(x=>x.id==V.uid);
 const{error}=await sb.from('mf_pesos').insert({aluno_id:a.sb,kg:w});if(error)return toast('Não foi possível salvar: '+error.message);
 (S.pesos[V.uid]=S.pesos[V.uid]||[]).push(w);render()}
/* entrar() fica na seção de autenticação */
/* sair() fica na seção de autenticação */
const go=t=>{V.tab=t;render()};

/* ===== Estrutura ===== */
function login(){const r=once('icon');return`<div class="lg ${once('lg')?'fade':''}"><div class="box"><div class="tile ${r?'pop':''}" style="color:#fff">${LG(54,3.4,r?'run':'')}</div><h2>MOVEFIT</h2><p>Treino, presença e evolução em um só lugar</p>
 <input id="le" type="email" placeholder="E-mail" autocomplete="username" value="${esc(AU.email)}" onkeydown="if(event.key=='Enter')$('#lp').focus()">
 <input id="lp" type="password" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key=='Enter')entrar()">
 <button class="keep ${AU.keep?'on':''}" type="button" role="checkbox" aria-checked="${AU.keep}" onclick="toggleKeep(this)"><i>${ic('ok',14)}</i>Manter conectado neste aparelho</button>
 <div class="er" role="alert"></div>
 <button class="btn" onclick="entrar()">Entrar</button>
 <button class="lk" onclick="esqueci()">Esqueci minha senha</button></div></div>`}
function novaSenha(){const r=once('icon');return`<div class="lg ${once('lg')?'fade':''}"><div class="box"><div class="tile ${r?'pop':''}" style="color:#fff">${LG(54,3.4,r?'run':'')}</div><h2>Nova senha</h2><p>Escolha uma senha nova para sua conta</p>
 <input id="lp" type="password" placeholder="Nova senha (mínimo 6 caracteres)" autocomplete="new-password" onkeydown="if(event.key=='Enter')salvarSenha()">
 <div class="er" role="alert"></div><button class="btn" onclick="salvarSenha()">Salvar senha</button></div></div>`}
function shell(items,body){const pro=V.role!='aluno',a=S.alunos.find(x=>x.id==V.uid),rl={acad:['Academia',V.nome||S.academia.nome],pro:['Profissional',V.nome||profNome(V.pid)],aluno:['Aluno']}[V.role];
 return`<div class="app ${once('app')?'fade':''}"><nav><div class="brand"><i style="color:#fff">${LG(20,3.6)}</i>MOVEFIT</div><div class="lb">${rl[0]}</div>
 ${items.map(i=>`<button class="${V.tab==i[0]?'on':''}" onclick="go('${i[0]}')">${ic(i[2])}<span>${i[1]}</span></button>`).join('')}
 <div class="sp"></div><div class="usr"><b>${esc((pro?rl[1]:a.nome)[0])}</b><div>${esc(pro?rl[1]:a.nome.split(' ')[0])}<small>${pro?rl[0]:esc(a.obj)}</small></div></div>
 <button class="lgo" onclick="sair()">${ic('out',18)}<span>Sair</span></button></nav><main>${body}</main></div>`}
function render(){const el=$('#app');if(!V.role){el.innerHTML=login();return}
 const R={acad:[NA,PA],pro:[NP,PV],aluno:[NS,SV]}[V.role];el.innerHTML=shell(R[0],R[1][V.tab]());
 if(V.role!='aluno'&&V.modal)el.insertAdjacentHTML('beforeend',modalAluno());if(V.role!='aluno'&&V.acesso)el.insertAdjacentHTML('beforeend',acessoModal());if(V.role!='aluno'&&V.cred)el.insertAdjacentHTML('beforeend',credModal())}
/* ===== Autenticação (Supabase Auth) =====
   Papéis vêm da tabela public.perfis (id = auth.users.id, nome, papel, academia_id).
   A proteção real dos dados é feita pelas regras RLS do banco, não por esta tela. */
const KEEP='movefit.keep';
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const store={getItem:k=>{try{return localStorage.getItem(k)??sessionStorage.getItem(k)}catch(e){return null}},
 setItem:(k,v)=>{try{const keep=lsGet(KEEP)!='0';(keep?localStorage:sessionStorage).setItem(k,v);(keep?sessionStorage:localStorage).removeItem(k)}catch(e){}},
 removeItem:k=>{try{localStorage.removeItem(k);sessionStorage.removeItem(k)}catch(e){}}};
const sb=window.supabase?window.supabase.createClient(SB.url,SB.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:store}}):null;
const AU={keep:lsGet(KEEP)!='0',email:''};
const T0=Date.now(),splashWait=()=>new Promise(r=>setTimeout(r,Math.max(0,1100-(Date.now()-T0))));
const setMsg=(t,ok)=>{const e=$('.er');if(e){e.textContent=t;e.className='er'+(ok?' ok':'')}};
const toggleKeep=b=>{AU.keep=!AU.keep;b.classList.toggle('on',AU.keep);b.setAttribute('aria-checked',AU.keep)};
const msgErr=e=>{const m=String(e&&e.message||e);return/banned/i.test(m)?MSG_INATIVO:/invalid login/i.test(m)?'E-mail ou senha incorretos.':/not confirmed/i.test(m)?'Confirme seu e-mail antes de entrar.':/rate limit|too many/i.test(m)?'Muitas tentativas. Aguarde um pouco.':/network|fetch/i.test(m)?'Sem conexão com o servidor.':/password/i.test(m)?'Senha inválida: use pelo menos 6 caracteres.':'Erro: '+m};
async function entrar(){const e=$('#le').value.trim(),p=$('#lp').value;AU.email=e;if(!e||!p)return setMsg('Informe e-mail e senha.');
 const b=$('.lg .btn');b.disabled=true;b.textContent='Entrando…';setMsg('');
 try{localStorage.setItem(KEEP,AU.keep?'1':'0')}catch(x){}
 const{data,error}=await sb.auth.signInWithPassword({email:e,password:p});
 if(error){b.disabled=false;b.textContent='Entrar';return setMsg(msgErr(error))}
 await abrir(data.user)}
async function sincronizar(user,pf,R){
 const lid=u=>u==null?0:(S.map[u]||(S.map[u]=++S.nid));
 S.alunos=[];S.profs=[];
 try{
  const[a,p,c]=await Promise.all([sb.from('alunos').select('*'),sb.from('perfis').select('id,nome,telefone').eq('papel','profissional'),sb.from('academias').select('*').limit(1)]);
  if(a.error)toast('Não foi possível carregar os alunos: '+a.error.message);
  S.profs=(p.data||[]).map(x=>({id:lid(x.id),sb:x.id,nome:x.nome||'Profissional',tel:x.telefone||'—'}));
  if(R=='pro'&&!S.profs.some(x=>x.sb==user.id))S.profs.push({id:lid(user.id),sb:user.id,nome:pf.nome,tel:'—'});
  S.alunos=(a.data||[]).map(x=>({id:lid(x.id),sb:x.id,perfil:x.perfil_id,nome:x.nome||'Aluno',tel:x.whatsapp||'—',plano:x.plano||'Mensal',venc:x.vencimento||K(D(30)),obj:x.objetivo||'—',ativo:x.ativo!==false,prof:lid(x.profissional_id)})).sort((m,n)=>m.nome.localeCompare(n.nome,'pt-BR'));
  S.academia={nome:(c.data&&c.data[0]&&c.data[0].nome)||'MOVEFIT',tel:''};
  S.plano={};S.pres={};S.done={};S.pesos={};
  const byDb={};S.alunos.forEach(x=>byDb[x.sb]=x.id);
  const pega=async mk=>{let o=[],i=0;for(;;){const r=await mk().range(i,i+999);if(r.error)return r;o=o.concat(r.data||[]);if((r.data||[]).length<1000)return{data:o};i+=1000}};
  const hoje=K(new Date());
  const[ex,pr,fe,pe]=await Promise.all([pega(()=>sb.from('mf_exercicios').select('*').order('id')),pega(()=>sb.from('mf_presencas').select('aluno_id,dia').gte('dia',K(D(-30))).order('dia')),pega(()=>sb.from('mf_feitos').select('aluno_id,exercicio_id').eq('dia',hoje).order('exercicio_id')),pega(()=>sb.from('mf_pesos').select('aluno_id,kg').order('dia').order('id'))]);
  const er=[ex,pr,fe,pe].find(r=>r.error);if(er)toast('Treinos não carregaram. Rode o script 06 no Supabase. ('+er.error.message+')');
  (ex.data||[]).forEach(x=>{const i=byDb[x.aluno_id];if(i)pl(i,x.dia).push({id:+x.id,n:x.nome,s:x.series,r:x.reps,c:x.carga,foto:x.foto||''})});
  (pr.data||[]).forEach(x=>{const i=byDb[x.aluno_id];if(i)(S.pres[x.dia]=S.pres[x.dia]||[]).push(i)});
  (fe.data||[]).forEach(x=>{const i=byDb[x.aluno_id];if(i)(S.done[hoje+'|'+i]=S.done[hoje+'|'+i]||[]).push(+x.exercicio_id)});
  (pe.data||[]).forEach(x=>{const i=byDb[x.aluno_id];if(i)(S.pesos[i]=S.pesos[i]||[]).push(+x.kg)});
 }catch(e){toast('Erro ao carregar dados: '+(e.message||e))}
 V.pid=R=='pro'?lid(user.id):0;
 const eu=S.alunos.find(x=>x.perfil&&x.perfil==user.id);V.uid=eu?eu.id:0;save()}
const MSG_INATIVO='Seu acesso está inativo. Fale com seu professor.';
const inativo=()=>{const e=S.alunos.find(x=>x.id==V.uid);return !!e&&!e.ativo};
async function abrir(user){const{data:pf,error}=await sb.from('perfis').select('nome,papel,academia_id,ativo').eq('id',user.id).maybeSingle();
 await splashWait();
 if(pf&&pf.ativo===false){await sb.auth.signOut();V.role=null;render();return setMsg(MSG_INATIVO)}
 const R={academia:'acad',profissional:'pro',aluno:'aluno'}[pf&&pf.papel];
 if(error||!R){await sb.auth.signOut();render();return setMsg(error?'Não foi possível ler seu perfil. Verifique se o SQL do banco foi executado.':'Sua conta ainda não tem perfil de acesso. Fale com a academia.')}
 await sincronizar(user,pf,R);V.sess={user,pf,R};V.last=Date.now();
 if(R=='aluno'&&inativo()){await sb.auth.signOut();V.role=null;render();return setMsg(MSG_INATIVO)}
 if(R=='aluno'&&!V.uid){await sb.auth.signOut();V.role=null;render();return setMsg('Não encontramos seu cadastro de aluno. Fale com o professor.')}
 V.acadId=pf.academia_id;V.role=R;V.nome=pf.nome;V.tab=R=='aluno'?'hoje':'painel';V.dia=new Date().getDay();render()}
async function esqueci(){const e=$('#le').value.trim();if(!e)return setMsg('Digite seu e-mail acima e toque novamente.');
 const{error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});
 setMsg(error?msgErr(error):'Enviamos um link para redefinir sua senha no e-mail informado.',!error)}
async function salvarSenha(){const p=$('#lp').value;if(p.length<6)return setMsg('Use pelo menos 6 caracteres.');
 const{data,error}=await sb.auth.updateUser({password:p});if(error)return setMsg(msgErr(error));
 history.replaceState(null,'',location.pathname);await abrir(data.user)}
async function sair(){V.role=null;V.modal=null;if(sb)await sb.auth.signOut();render()}
async function boot(){const a=$('#app');
 if(!sb){a.innerHTML=login();return setMsg('Não foi possível carregar o serviço de login. Verifique sua conexão.')}
 a.innerHTML='<div class="lg intro"><div class="box"><div class="tile pop" style="color:#fff">'+LG(54,3.4,once('icon')?'run':'')+'</div><h2>MOVEFIT</h2><p>Carregando…</p></div></div>';
 sb.auth.onAuthStateChange(ev=>{if(ev=='PASSWORD_RECOVERY'){V.role=null;splashWait().then(()=>{a.innerHTML=novaSenha()})}else if(ev=='SIGNED_OUT'&&V.role){V.role=null;V.modal=null;render()}});
 if(/type=recovery/.test(location.hash))return;
 try{const{data}=await sb.auth.getSession();if(data.session)return await abrir(data.session.user)}catch(e){}
 await splashWait();render()}
document.addEventListener('visibilitychange',async()=>{if(document.hidden||!V.role||!V.sess||V.modal||V.acesso||V.cred||busy||Date.now()-V.last<20000)return;V.last=Date.now();await sincronizar(V.sess.user,V.sess.pf,V.sess.R);if(V.sess.R=='aluno'&&inativo()){V.role=null;await sb.auth.signOut();render();return setMsg(MSG_INATIVO)}render()});
boot();
</script>
